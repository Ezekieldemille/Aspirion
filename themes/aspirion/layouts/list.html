
{{ define "main" }}
<section class="page-shell listing-page">
  <div class="breadcrumbs">
    <a href="{{ "/" | relURL }}">Home</a>
    <span aria-hidden="true">/</span> {{ .Title }}
  </div>

  <header class="article-heading">
    <h1>{{ .Title }}</h1>
  </header>

  {{ with .Content }}
    <div class="prose section-intro">{{ . }}</div>
  {{ end }}

  <div class="section-list">
    {{ range .Pages }}
    <a class="list-entry" href="{{ .RelPermalink }}">
      <div>
        <h2>{{ .Title }}</h2>
      </div>
      <span class="entry-arrow" aria-hidden="true">&rarr;</span>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
